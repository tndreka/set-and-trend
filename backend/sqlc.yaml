version: "2"

sql:
  - engine: "postgresql"
    schema:
      - "migrations/000001_init_schema.up.sql"
      - "migrations/000006_add_user_auth_fields.up.sql"
      - "migrations/000007_add_trade_feedback.up.sql"
      - "migrations/000008_hns_pattern_detection.up.sql"
      - "migrations/000011_add_check_constraints.up.sql"
      - "migrations/000012_add_symbol_to_candles.up.sql"
      - "migrations/000013_restore_journal_schema.up.sql"
      - "migrations/000014_add_strategies_and_signals.up.sql"
      # 000015 skipped: seed data (INSERT/UPDATE)
      - "migrations/000016_ai_layer.up.sql"
      # 000017, 000018 skipped: seed data (INSERT/UPDATE)
    queries: "internal/db/queries/"
    gen:
      go:
        package: "db"
        out: "internal/db"
        sql_package: "pgx/v5"
        
        emit_json_tags: true
        emit_prepared_queries: false
        emit_interface: true
        emit_exact_table_names: false
        
        overrides:
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          
          - db_type: "timestamptz"
            go_type:
              import: "github.com/jackc/pgx/v5/pgtype"
              type: "Timestamptz"
          
          - db_type: "timestamp"
            go_type:
              import: "github.com/jackc/pgx/v5/pgtype"
              type: "Timestamptz"
          
          - db_type: "pg_catalog.numeric"
            nullable: false
            go_type:
              import: "github.com/shopspring/decimal"
              type: "Decimal"
          
          - db_type: "pg_catalog.numeric"
            nullable: true
            go_type:
              import: "github.com/shopspring/decimal"
              type: "Decimal"
          
          - db_type: "numeric"
            nullable: false
            go_type:
              import: "github.com/shopspring/decimal"
              type: "Decimal"
          
          - db_type: "numeric"
            nullable: true
            go_type:
              import: "github.com/shopspring/decimal"
              type: "Decimal"
          
          - db_type: "int8"
            nullable: true
            go_type:
              import: "github.com/jackc/pgx/v5/pgtype"
              type: "Int8"
          
          - db_type: "int4"
            nullable: true
            go_type:
              import: "github.com/jackc/pgx/v5/pgtype"
              type: "Int4"
          
          - db_type: "date"
            go_type:
              import: "github.com/jackc/pgx/v5/pgtype"
              type: "Date"
